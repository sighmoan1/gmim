{% extends 'base.html' %} {% block title %} Attribute GMIMCoin - GMIMCoin {%
endblock %} {% block content %}
<h1>Attribute {{ amount }} GMIMCoin</h1>

{% if logged_in %}
<form action="{{ url_for('attribute', token=token) }}" method="POST">
  <p>Attribute to: <strong>{{ username }}</strong></p>
  <button type="submit">Confirm Attribution</button>
</form>
{% else %}
<h2>Login to Claim GMIMCoin</h2>
<form action="{{ url_for('attribute', token=token) }}" method="POST">
  <label for="username">Username:</label>
  <input
    type="text"
    id="username"
    name="username"
    required
    maxlength="150"
    placeholder="Enter your username"
  />
  <button type="submit">Login and Claim</button>
</form>
{% endif %}

<p><a href="{{ url_for('login') }}">Back to Login</a></p>
<p><a href="{{ url_for('logout') }}">Logout</a></p>
{% endblock %}
