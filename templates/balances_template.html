<table class="user-balances-table">
  <thead>
    <tr>
      <th>Username</th>
      <th>GMIMCoin Balance</th>
      <th>Role</th>
    </tr>
  </thead>
  <tbody>
    {% for user in sorted_users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.balance }}</td>
      <td>{{ user.role }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
